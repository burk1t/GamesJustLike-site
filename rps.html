<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Камень-ножницы-бумага — GameJustLike</title>
    <link rel="icon" type="image/svg+xml" href="images/gamesjustlike-icon.svg" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <nav class="site-navbar">
            <div class="site-navbar-inner">
                <a class="site-logo" href="index.html" aria-label="GameJustLike — на главную">
                    <img src="images/gamesjustlike-logo.svg" alt="GameJustLike" width="216" height="40" />
                </a>
                <div class="site-nav">
                    <a href="index.html" class="site-nav-link">🎮 Каталог игр</a>
                    <a href="games.html" class="site-nav-link active">🌐 Онлайн игры</a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="game-page">
            <a href="games.html" class="game-back">← К списку игр</a>
            <h1 class="arcade-title">✊✋✌ Камень-ножницы-бумага</h1>
            <div class="arcade-status">
                Счёт: <strong id="rpsPlayerScore">0</strong> : <strong id="rpsComputerScore">0</strong>
            </div>
            <div class="rps-arena">
                <div class="rps-side">
                    <div class="rps-label">Вы</div>
                    <div class="rps-pick" id="rpsPlayerPick">❔</div>
                </div>
                <div class="rps-vs">VS</div>
                <div class="rps-side">
                    <div class="rps-label">Компьютер</div>
                    <div class="rps-pick" id="rpsComputerPick">❔</div>
                </div>
            </div>
            <div class="rps-result" id="rpsResult"></div>
            <div class="rps-buttons">
                <button class="rps-btn" data-choice="rock">✊<span>Камень</span></button>
                <button class="rps-btn" data-choice="paper">✋<span>Бумага</span></button>
                <button class="rps-btn" data-choice="scissors">✌<span>Ножницы</span></button>
            </div>
            <p class="arcade-hint">Выберите жест — компьютер ответит случайно.</p>
        </div>
    </main>

    <footer class="site-footer">
        <div>© 2026 - GameJustLike</div>
    </footer>

    <script>
        (function () {
            var ICONS = { rock: '✊', paper: '✋', scissors: '✌' };
            var NAMES = { rock: 'Камень', paper: 'Бумага', scissors: 'Ножницы' };

            var playerScore = 0, computerScore = 0;
            var playerPickEl = document.getElementById('rpsPlayerPick');
            var computerPickEl = document.getElementById('rpsComputerPick');
            var resultEl = document.getElementById('rpsResult');
            var playerScoreEl = document.getElementById('rpsPlayerScore');
            var computerScoreEl = document.getElementById('rpsComputerScore');

            function randomChoice() {
                var keys = Object.keys(ICONS);
                return keys[Math.floor(Math.random() * keys.length)];
            }

            function play(playerChoice) {
                var computerChoice = randomChoice();
                playerPickEl.textContent = ICONS[playerChoice];
                computerPickEl.textContent = ICONS[computerChoice];
                resultEl.className = 'rps-result';

                if (playerChoice === computerChoice) {
                    resultEl.textContent = 'Ничья!';
                    resultEl.classList.add('draw');
                } else if (
                    (playerChoice === 'rock' && computerChoice === 'scissors') ||
                    (playerChoice === 'paper' && computerChoice === 'rock') ||
                    (playerChoice === 'scissors' && computerChoice === 'paper')
                ) {
                    playerScore++;
                    resultEl.textContent = 'Вы победили! ' + NAMES[playerChoice] + ' побеждает ' + NAMES[computerChoice];
                    resultEl.classList.add('win');
                } else {
                    computerScore++;
                    resultEl.textContent = 'Вы проиграли. ' + NAMES[computerChoice] + ' побеждает ' + NAMES[playerChoice];
                    resultEl.classList.add('lose');
                }

                playerScoreEl.textContent = playerScore;
                computerScoreEl.textContent = computerScore;
            }

            document.querySelectorAll('.rps-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    play(btn.dataset.choice);
                });
            });
        })();
    </script>
</body>
</html>
